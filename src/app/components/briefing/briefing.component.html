<section id="briefing" class="py-24 bg-[#f7f7f8] relative">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-[#e8e8ea]">
      <div class="p-8 md:p-12">
        <div class="text-center mb-10">
          <h2 class="text-3xl font-serif mb-4 text-[#111113]">Inicie seu Projeto</h2>
          <p class="text-stone-500 text-sm max-w-lg mx-auto">
            Preencha o formulário abaixo para analisarmos seu escopo e avaliarmos como nosso estúdio pode atender ao seu objetivo.
          </p>
        </div>

        <form [formGroup]="briefingForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-stone-700 mb-1">Nome Completo</label>
              <input type="text" formControlName="name" class="w-full px-4 py-3 rounded-lg border border-stone-200 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-[#111113] focus:border-transparent outline-none transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-stone-700 mb-1">E-mail</label>
              <input type="email" formControlName="email" class="w-full px-4 py-3 rounded-lg border border-stone-200 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-[#111113] focus:border-transparent outline-none transition-all">
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-stone-700 mb-1">Tipo de Imóvel</label>
              <select formControlName="projectType" class="w-full px-4 py-3 rounded-lg border border-stone-200 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-[#111113] focus:border-transparent outline-none transition-all text-stone-700">
                <option value="" disabled>Selecione...</option>
                <option value="Residencial (Apartamento)">Residencial (Apartamento)</option>
                <option value="Residencial (Casa)">Residencial (Casa)</option>
                <option value="Comercial">Comercial</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-stone-700 mb-1">Orçamento Estimado</label>
              <select formControlName="budget" class="w-full px-4 py-3 rounded-lg border border-stone-200 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-[#111113] focus:border-transparent outline-none transition-all text-stone-700">
                <option value="" disabled>Selecione uma faixa...</option>
                <option value="Até R$ 20.000">Até R$ 20.000</option>
                <option value="R$ 20.000 a R$ 50.000">R$ 20.000 a R$ 50.000</option>
                <option value="R$ 50.000 a R$ 100.000">R$ 50.000 a R$ 100.000</option>
                <option value="Acima de R$ 100.000">Acima de R$ 100.000</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-stone-700 mb-1">Descreva seu projeto</label>
            <p class="text-xs text-stone-400 mb-2">Quais ambientes deseja projetar? Quais são as suas maiores dores hoje no espaço?</p>
            <textarea formControlName="description" rows="4" class="w-full px-4 py-3 rounded-lg border border-stone-200 bg-stone-50 focus:bg-white focus:ring-2 focus:ring-[#111113] focus:border-transparent outline-none transition-all resize-none"></textarea>
          </div>

          <div class="pt-4 text-center">
            <button type="submit" [disabled]="briefingForm.invalid || isSubmitting()" class="w-full md:w-auto px-10 py-4 bg-[#111113] text-white rounded-full font-medium hover:bg-stone-800 focus:ring-4 focus:ring-stone-200 transition-all duration-300 flex items-center justify-center mx-auto disabled:opacity-70 disabled:cursor-not-allowed cursor-pointer">
              @if (isSubmitting()) {
                <svg class="animate-spin h-5 w-5 text-white mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Enviando...</span>
              } @else {
                <span>Enviar para Análise</span>
                <i class="ph ph-paper-plane-right ml-2 text-xl"></i>
              }
            </button>
            <p class="text-xs text-stone-400 mt-4"><i class="ph ph-lock-key"></i> Suas informações estão seguras. Responderemos em até 48h úteis.</p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
