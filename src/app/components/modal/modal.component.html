<div 
  class="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm transition-all duration-300"
  [class.opacity-0]="!isOpen()"
  [class.pointer-events-none]="!isOpen()"
>
  <div 
    class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl transform transition-transform duration-300"
    [class.scale-95]="!isOpen()"
    [class.scale-100]="isOpen()"
  >
    <div 
      class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"
      [class.bg-green-100]="type() === 'success'"
      [class.text-green-600]="type() === 'success'"
      [class.bg-red-100]="type() === 'error'"
      [class.text-red-600]="type() === 'error'"
    >
      @if (type() === 'success') {
        <i class="ph ph-check-circle text-4xl"></i>
      } @else {
        <i class="ph ph-warning-circle text-4xl"></i>
      }
    </div>
    <h3 class="text-xl font-semibold text-center mb-2 text-[#111113]">{{ title() }}</h3>
    <p class="text-stone-500 text-center text-sm mb-6">{{ message() }}</p>
    <button 
      (click)="onClose()" 
      class="w-full py-3 bg-[#111113] text-white rounded-lg font-medium hover:bg-stone-800 transition-colors cursor-pointer"
    >
      Entendi
    </button>
  </div>
</div>
